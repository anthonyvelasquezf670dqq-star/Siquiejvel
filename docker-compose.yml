version: '3.9'
services:
  mongo:
    image: mongo:7.0
    container_name: ownlibrary-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ownlibrary
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: ownlibrary-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/ownlibrary
      - JWT_SECRET=change-me
    ports:
      - '5000:5000'
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ownlibrary-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo-data:
